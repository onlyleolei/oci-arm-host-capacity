name: OCI Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create OCI config and keys
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oracle.pem
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ~/.oci/id_rsa.pub
          sed -i '/key_file/c\key_file=/home/runner/.oci/oracle.pem' ~/.oci/config
          chmod 600 ~/.oci/oracle.pem

      - name: Auto Generate Env File
        run: |
          # 从 OCI_CONFIG 中提取必要参数补全到 .env
          REGION=$(grep -i '^region' ~/.oci/config | cut -d'=' -f2 | tr -d ' \r\n')
          USER_ID=$(grep -i '^user' ~/.oci/config | cut -d'=' -f2 | tr -d ' \r\n')
          TENANCY_ID=$(grep -i '^tenancy' ~/.oci/config | cut -d'=' -f2 | tr -d ' \r\n')
          FINGERPRINT=$(grep -i '^fingerprint' ~/.oci/config | cut -d'=' -f2 | tr -d ' \r\n')

          cat <<EOF > .env
          OCI_REGION=$REGION
          OCI_USER_ID=$USER_ID
          OCI_TENANCY_ID=$TENANCY_ID
          OCI_FINGERPRINT=$FINGERPRINT
          OCI_KEY_FILE=/home/runner/.oci/oracle.pem
          OCI_CONFIG_FILE_PATH=/home/runner/.oci/config
          EOF

      - name: Execute capacity check
        env:
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS }}
        run: php index.php
