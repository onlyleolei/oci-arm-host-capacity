name: OCI Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create OCI config and keys
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oracle.pem
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ~/.oci/id_rsa.pub
          chmod 600 ~/.oci/oracle.pem

      - name: Parse Config and Generate .env
        run: |
          php -r '
            $configPath = getenv("HOME") . "/.oci/config";
            if (!file_exists($configPath)) {
                echo "Error: Config file not found!\n";
                exit(1);
            }
            $content = file_get_contents($configPath);

            function getVal($pattern, $text) {
                if (preg_match($pattern, $text, $m)) {
                    return trim($m[1], " \t\n\r\"'\v\0");
                }
                return "";
            }

            $user = getVal("/^[ \t]*user[ \t]*=[ \t]*(.+)$/m", $content);
            $tenancy = getVal("/^[ \t]*tenancy[ \t]*=[ \t]*(.+)$/m", $content);
            $fingerprint = getVal("/^[ \t]*fingerprint[ \t]*=[ \t]*(.+)$/m", $content);
            $region = getVal("/^[ \t]*region[ \t]*=[ \t]*(.+)$/m", $content);

            echo "User: " . ($user ? "OK" : "MISSING") . "\n";
            echo "Tenancy: " . ($tenancy ? "OK" : "MISSING") . "\n";
            echo "Fingerprint: " . ($fingerprint ? "OK" : "MISSING") . "\n";
            echo "Region: " . ($region ? "OK" : "MISSING") . "\n";

            $envContent = "OCI_USER_ID={$user}\n"
                        . "OCI_TENANCY_ID={$tenancy}\n"
                        . "OCI_FINGERPRINT={$fingerprint}\n"
                        . "OCI_REGION={$region}\n"
                        . "OCI_KEY_FILE=" . getenv("HOME") . "/.oci/oracle.pem\n"
                        . "OCI_CONFIG_FILE_PATH=" . getenv("HOME") . "/.oci/config\n";

            file_put_contents(".env", $envContent);
            
            $ghEnv = getenv("GITHUB_ENV");
            if ($ghEnv) {
                file_put_contents($ghEnv, $envContent, FILE_APPEND);
            }
          '

      - name: Execute capacity check
        env:
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: php index.php
