name: OCI Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create OCI config and keys
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oracle.pem
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ~/.oci/id_rsa.pub
          chmod 600 ~/.oci/oracle.pem

      - name: Parse Config with PHP
        run: |
          php -r '
            $configPath = getenv("HOME") . "/.oci/config";
            $keyPath = getenv("HOME") . "/.oci/oracle.pem";
            $githubEnv = getenv("GITHUB_ENV");

            if (!file_exists($configPath)) {
                echo "Error: Config file not found!\n";
                exit(1);
            }

            $ini = parse_ini_file($configPath);
            $mapping = [
                "user" => "OCI_USER_ID",
                "tenancy" => "OCI_TENANCY_ID",
                "fingerprint" => "OCI_FINGERPRINT",
                "region" => "OCI_REGION"
            ];

            foreach ($mapping as $iniKey => $envKey) {
                if (isset($ini[$iniKey]) && !empty(trim($ini[$iniKey]))) {
                    $val = trim($ini[$iniKey]);
                    file_put_contents($githubEnv, "{$envKey}={$val}\n", FILE_APPEND);
                    echo "Loaded {$envKey}\n";
                } else {
                    echo "Warning: {$iniKey} missing in config!\n";
                }
            }

            file_put_contents($githubEnv, "OCI_KEY_FILE={$keyPath}\n", FILE_APPEND);
            file_put_contents($githubEnv, "OCI_CONFIG_FILE_PATH={$configPath}\n", FILE_APPEND);
          '

      - name: Execute capacity check
        env:
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: php index.php
