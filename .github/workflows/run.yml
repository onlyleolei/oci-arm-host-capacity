name: OCI Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create OCI config and keys
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" | tr -d '\r' > ~/.oci/config
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | tr -d '\r' > ~/.oci/oracle.pem
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" | tr -d '\r' > ~/.oci/id_rsa.pub
          chmod 600 ~/.oci/oracle.pem

      - name: Parse Config and Export Env
        env:
          SECRET_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          SECRET_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SECRET_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SECRET_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SECRET_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
        run: |
          cat << 'EOF' > parse.php
          <?php
          $configPath = getenv("HOME") . "/.oci/config";
          $content = file_exists($configPath) ? file_get_contents($configPath) : "";
          $content = str_replace("\r", "", $content);

          function getVal($pattern, $text) {
              if (preg_match($pattern, $text, $m)) {
                  return trim($m[1], " \t\n\r\"'\v\0");
              }
              return "";
          }

          $user = getVal("/^[ \t]*user[ \t]*=[ \t]*(.+)$/m", $content);
          $tenancy = getVal("/^[ \t]*tenancy[ \t]*=[ \t]*(.+)$/m", $content);
          $fingerprint = getVal("/^[ \t]*fingerprint[ \t]*=[ \t]*(.+)$/m", $content);
          $region = getVal("/^[ \t]*region[ \t]*=[ \t]*(.+)$/m", $content);

          if (empty($fingerprint) && !empty(getenv("SECRET_FINGERPRINT"))) {
              $fingerprint = trim(str_replace("\r", "", getenv("SECRET_FINGERPRINT")));
          }

          $compartmentId = getenv("SECRET_COMPARTMENT_ID") ?: $tenancy;
          $subnetId = getenv("SECRET_SUBNET_ID") ?: "";
          $imageId = getenv("SECRET_IMAGE_ID") ?: "";
          $availabilityDomain = getenv("SECRET_AVAILABILITY_DOMAIN") ?: "";

          $keyFile = getenv("HOME") . "/.oci/oracle.pem";
          $configFile = getenv("HOME") . "/.oci/config";

          // 强制所有值转为 string，防止 getenv 返回 bool(false)
          $envVars = [
              "OCI_USER_ID" => (string)$user,
              "OCI_TENANCY_ID" => (string)$tenancy,
              "OCI_FINGERPRINT" => (string)$fingerprint,
              "OCI_KEY_FINGERPRINT" => (string)$fingerprint,
              "OCI_REGION" => (string)$region,
              "OCI_KEY_FILE" => (string)$keyFile,
              "OCI_PRIVATE_KEY_FILENAME" => (string)$keyFile,
              "OCI_PRIVATE_KEY_FILE_PATH" => (string)$keyFile,
              "OCI_CONFIG_FILE_PATH" => (string)$configFile,
              "OCI_COMPARTMENT_ID" => (string)$compartmentId,
              "OCI_SUBNET_ID" => (string)$subnetId,
              "OCI_IMAGE_ID" => (string)$imageId,
              "OCI_AVAILABILITY_DOMAIN" => (string)$availabilityDomain,
          ];

          $envLines = [];
          foreach ($envVars as $k => $v) {
              $envLines[] = "{$k}={$v}";
          }

          $envContent = implode("\n", $envLines) . "\n";
          file_put_contents(".env", $envContent);

          $ghEnv = getenv("GITHUB_ENV");
          if ($ghEnv) {
              file_put_contents($ghEnv, $envContent, FILE_APPEND);
          }
          EOF
          php parse.php

      - name: Execute capacity check
        env:
          OCI_USER_ID: ${{ env.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ env.OCI_TENANCY_ID }}
          OCI_FINGERPRINT: ${{ env.OCI_FINGERPRINT }}
          OCI_KEY_FINGERPRINT: ${{ env.OCI_KEY_FINGERPRINT }}
          OCI_REGION: ${{ env.OCI_REGION }}
          OCI_KEY_FILE: ${{ env.OCI_KEY_FILE }}
          OCI_PRIVATE_KEY_FILENAME: ${{ env.OCI_PRIVATE_KEY_FILENAME }}
          OCI_PRIVATE_KEY_FILE_PATH: ${{ env.OCI_PRIVATE_KEY_FILE_PATH }}
          OCI_CONFIG_FILE_PATH: ${{ env.OCI_CONFIG_FILE_PATH }}
          OCI_COMPARTMENT_ID: ${{ env.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ env.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ env.OCI_IMAGE_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ env.OCI_AVAILABILITY_DOMAIN }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: php index.php
